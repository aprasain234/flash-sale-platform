apiVersion: v1
kind: ConfigMap
metadata:
  name: flash-sale-config
  namespace: flash-sale
data:
  # Point these at your managed services in real EKS: ElastiCache for Redis,
  # MSK or a Kafka on EKS deployment, and RDS for Postgres. Running stateful
  # infra as plain pods on EKS works for a demo but isn't how you'd run this
  # for real — call that out explicitly if asked about it in an interview.
  REDIS_HOST: "redis.flash-sale.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.flash-sale.svc.cluster.local:9092"
  DB_HOST: "postgres.flash-sale.svc.cluster.local"
  DB_PORT: "5433"
  DB_NAME: "flashsale_orders"
  DB_USER: "postgres"
  DB_PASSWORD: "ashish123"
  INVENTORY_SERVICE_URI: "http://inventory-service.flash-sale.svc.cluster.local:8081"
  ORDER_SERVICE_URI: "http://order-service.flash-sale.svc.cluster.local:8082"
  PAYMENT_SERVICE_URI: "http://payment-service.flash-sale.svc.cluster.local:8083"
